      <ellipse cx="44" cy="25" rx="3.2" ry="4"/><ellipse cx="38.5" cy="39" rx="3.8" ry="3.3"/>
      <ellipse cx="25" cy="44.5" rx="4.2" ry="3.1"/><ellipse cx="11.5" cy="39" rx="3.5" ry="3.5"/>
      <ellipse cx="6" cy="25" rx="3.1" ry="4.1"/><ellipse cx="11.5" cy="11" rx="3.7" ry="3.2"/>
    </g>
    <g fill="#a3a09a" stroke="none">
      <ellipse cx="24" cy="4.5" rx="2" ry="1.3"/><ellipse cx="37.5" cy="10" rx="1.8" ry="1.3"/>
      <ellipse cx="43" cy="23.5" rx="1.4" ry="1.8"/><ellipse cx="37.5" cy="38" rx="1.8" ry="1.3"/>
      <ellipse cx="24" cy="43.5" rx="2" ry="1.2"/><ellipse cx="10.5" cy="38" rx="1.7" ry="1.4"/>
      <ellipse cx="5" cy="23.5" rx="1.4" ry="1.8"/><ellipse cx="10.5" cy="10" rx="1.8" ry="1.3"/>
