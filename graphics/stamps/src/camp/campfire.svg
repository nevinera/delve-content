      <stop offset="0" stop-color="#fff2a8"/><stop offset="0.35" stop-color="#ffb12e"/>
      <stop offset="0.7" stop-color="#e2541c" stop-opacity="0.85"/><stop offset="1" stop-color="#7a1d0c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ash" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3a302a"/><stop offset="1" stop-color="#5c524a"/>
    </radialGradient>
  </defs>
  <circle cx="25" cy="25" r="17" fill="url(#ash)"/>
  <g stroke="#3b2a1a" stroke-width="0.8">
    <rect x="11" y="22.5" width="28" height="5" rx="2.5" fill="#6b4a2c" transform="rotate(30 25 25)"/>
    <rect x="11" y="22.5" width="28" height="5" rx="2.5" fill="#7a5532" transform="rotate(-30 25 25)"/>
    <rect x="11" y="22.5" width="28" height="5" rx="2.5" fill="#5e4026" transform="rotate(90 25 25)"/>
  </g>
  <circle cx="25" cy="25" r="11" fill="url(#glow)"/>
