<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 22">
  <!-- A fallen log straight from above: a bark cylinder lit along its top, its sawn ends seen only as edges, so it reads the same turned any way. 10 units = 1 ft. -->
